<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow  (c) Biker82@github.com</title>
    <!-- VERSION 9.6 -->
	<!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            height: 10px;
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(156, 163, 175, 0.1);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.6);
        }
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }
        .drag-placeholder {
            border: 2px dashed #3b82f6;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 0.5rem;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 h-full flex flex-col font-sans transition-colors duration-200">

    <!-- Top Header Navigation -->
    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-4 py-3 flex-none">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <!-- App Logo & Title -->
            <div class="flex items-center gap-3">
                <div class="p-2 bg-brand-600 text-white rounded-xl shadow-md">
                    <i data-lucide="kanban" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xl tracking-tight leading-none text-slate-900 dark:text-white">TaskFlow</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">(c) Biker82@github.com</p>
                </div>
            </div>

            <!-- Auto-Backup Widget & Controls -->
            <div class="flex items-center flex-wrap gap-3">
                <!-- Auto-Backup Status Indicator -->
                <div class="flex items-center gap-2 bg-slate-100 dark:bg-slate-900/80 border border-slate-200 dark:border-slate-700 px-3 py-1.5 rounded-xl text-xs">
                    <button id="btn-toggle-backup" class="flex items-center gap-1.5 font-medium hover:text-brand-600 dark:hover:text-brand-400 transition" title="Auto-Sicherung konfigurieren / ein-ausschalten">
                        <span id="backup-status-dot" class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
                        <i data-lucide="hard-drive" class="w-3.5 h-3.5 text-slate-500 dark:text-slate-400"></i>
                        <span id="backup-status-text" class="text-slate-700 dark:text-slate-300">Auto-Backup: Nicht eingerichtet</span>
                    </button>
                    <button id="btn-setup-backup" class="ml-1 px-2 py-0.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded text-[11px] transition shadow-2xs">
                        Pfad wählen
                    </button>
                </div>

                <div class="h-6 w-px bg-slate-200 dark:bg-slate-700"></div>

                <button id="btn-add-task" class="flex items-center gap-1.5 px-3 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium transition shadow-sm">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i>
                    <span>Neue Aufgabe</span>
                </button>
                <button id="btn-manage-team" class="flex items-center gap-1.5 px-3 py-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-lg text-sm font-medium transition">
                    <i data-lucide="users" class="w-4 h-4"></i>
                    <span>Team</span>
                </button>

                <div class="h-6 w-px bg-slate-200 dark:bg-slate-700"></div>

                <!-- Export / Import -->
                <button id="btn-export" title="Manuell als JSON exportieren" class="p-2 text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition">
                    <i data-lucide="download" class="w-4 h-4"></i>
                </button>
                <label id="btn-import-label" title="Daten importieren (JSON)" class="p-2 text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition cursor-pointer">
                    <i data-lucide="upload" class="w-4 h-4"></i>
                    <input type="file" id="import-file-input" accept=".json" class="hidden">
                </label>

                <!-- Theme Toggle -->
                <button id="btn-theme-toggle" class="p-2 text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition">
                    <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
                    <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Filter & View Controls Toolbar -->
    <section class="bg-white dark:bg-slate-800/80 border-b border-slate-200 dark:border-slate-700 px-4 py-2.5 flex-none shadow-sm">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3">
            <!-- Search & Filters -->
            <div class="flex items-center flex-wrap gap-2 w-full md:w-auto">
                <div class="relative min-w-[200px] flex-1 md:flex-initial">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="filter-search" placeholder="Aufgabe suchen..." class="w-full pl-9 pr-3 py-1.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>

                <select id="filter-member" class="py-1.5 px-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                    <option value="ALL">Alle Mitarbeiter</option>
                </select>

                <select id="filter-status" class="py-1.5 px-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                    <option value="ALL">Alle Status</option>
                    <option value="OPEN">Offen</option>
                    <option value="IN_PROGRESS">In Bearbeitung</option>
                    <option value="WAIT">warte auf andere</option>
                    <option value="COMPLETED">Erledigt</option>
	            
                </select>

                <button id="btn-delete-completed" title="Erledigte Aufgaben löschen" class="p-2 text-rose-600 hover:text-rose-700 hover:bg-rose-50 dark:hover:bg-rose-950/30 rounded-lg transition text-xs flex items-center gap-1 font-medium">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Erledigte aufräumen</span>
                </button>
            </div>

            <!-- View & Mode Toggles -->
            <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-end border-t md:border-t-0 pt-2 md:pt-0 border-slate-200 dark:border-slate-700">
                <!-- Timeline View Mode Selector (Tage / Wochen / Monate) -->
                <div class="flex bg-slate-100 dark:bg-slate-900 p-1 rounded-lg border border-slate-200 dark:border-slate-700">
                    <button id="view-mode-days" class="px-2.5 py-1 text-xs font-semibold rounded-md transition-all bg-white dark:bg-slate-700 text-brand-600 dark:text-brand-400 shadow-sm">Tage</button>
                    <button id="view-mode-weeks" class="px-2.5 py-1 text-xs font-semibold rounded-md transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">Wochen (KW)</button>
                    <button id="view-mode-months" class="px-2.5 py-1 text-xs font-semibold rounded-md transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">Monate</button>
                </div>

                <!-- Main View Tabs (Gantt vs Task List) -->
                <div class="flex bg-slate-100 dark:bg-slate-900 p-1 rounded-lg border border-slate-200 dark:border-slate-700">
                    <button id="tab-btn-gantt" class="flex items-center gap-1.5 px-3 py-1 text-xs font-semibold rounded-md bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm transition">
                        <i data-lucide="gantt-chart" class="w-3.5 h-3.5"></i>
                        <span>Zeitleiste</span>
                    </button>
                    <button id="tab-btn-list" class="flex items-center gap-1.5 px-3 py-1 text-xs font-semibold rounded-md text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition">
                        <i data-lucide="list-todo" class="w-3.5 h-3.5"></i>
                        <span>Listenansicht</span>
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-hidden relative">
        <!-- GANTT VIEW -->
        <div id="view-gantt" class="h-full flex flex-col overflow-hidden">
            <div class="flex-1 flex overflow-hidden relative">
                <!-- Left Task Table Split -->
                <div id="gantt-sidebar" class="w-80 flex-none border-r border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/50 flex flex-col overflow-hidden z-10 shadow-md">
                    <div class="p-3 border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-semibold text-xs text-slate-500 dark:text-slate-400 uppercase tracking-wider flex justify-between items-center h-[57px]">
                        <span>Aufgabe / Unteraufgaben</span>
                        <span class="text-[10px] bg-slate-200 dark:bg-slate-700 px-1.5 py-0.5 rounded text-slate-600 dark:text-slate-300" id="task-count-badge">0</span>
                    </div>
                    <div id="gantt-sidebar-list" class="flex-1 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-800/60 custom-scrollbar">
                        <!-- Dynamic Sidebar Rows -->
                    </div>
                </div>

                <!-- Right Gantt Chart Viewport -->
                <div id="gantt-viewport" class="flex-1 overflow-x-auto overflow-y-auto bg-slate-50/50 dark:bg-slate-900/50 relative custom-scrollbar no-select">
                    <div id="gantt-container" class="min-h-full relative flex flex-col">
                        <!-- Timeline Header -->
                        <div id="gantt-header" class="sticky top-0 z-20 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex flex-col flex-none shadow-sm">
                            <div id="gantt-header-top" class="flex h-7 border-b border-slate-100 dark:border-slate-700/50 text-xs font-bold text-slate-600 dark:text-slate-300"></div>
                            <div id="gantt-header-bottom" class="flex h-7 text-[11px] font-medium text-slate-500 dark:text-slate-400"></div>
                        </div>

                        <!-- Timeline Body -->
                        <div id="gantt-body" class="flex-1 relative min-h-[400px]">
                            <div id="gantt-grid" class="absolute inset-0 pointer-events-none flex"></div>
                            <div id="gantt-rows" class="relative z-10"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- LIST VIEW -->
        <div id="view-list" class="h-full overflow-y-auto p-4 md:p-6 max-w-6xl mx-auto hidden custom-scrollbar">
            <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
                <div class="p-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center bg-slate-50/50 dark:bg-slate-800">
                    <h2 class="font-bold text-slate-800 dark:text-white flex items-center gap-2">
                        <i data-lucide="list-check" class="w-5 h-5 text-brand-500"></i>
                        <span>Aufgabenliste</span>
                    </h2>
                    <span class="text-xs text-slate-500 dark:text-slate-400">Drag & Drop zum Sortieren nutzen</span>
                </div>
                <div id="task-list-container" class="divide-y divide-slate-100 dark:divide-slate-700/50"></div>
            </div>
        </div>
    </main>

    <!-- LIVE DRAG TOOLTIP -->
    <div id="gantt-tooltip" class="fixed hidden z-50 pointer-events-none bg-slate-900 text-white text-xs px-2.5 py-1.5 rounded-md shadow-lg border border-slate-700 font-mono flex flex-col gap-0.5">
        <span id="tooltip-title" class="text-[11px] text-slate-400 border-b border-slate-800 pb-0.5 mb-0.5 truncate max-w-[200px]"></span>
        <span id="tooltip-dates" class="font-bold text-brand-300"></span>
        <span id="tooltip-duration" class="text-[10px] text-slate-300"></span>
    </div>

    <!-- MODAL: TASK CREATION / EDIT -->
    <div id="modal-task" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 w-full max-w-xl max-h-[90vh] flex flex-col overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-800/80">
                <h3 id="modal-task-title" class="font-bold text-lg text-slate-900 dark:text-white">Neue Aufgabe erstellen</h3>
                <button id="modal-task-close" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="form-task" class="p-6 overflow-y-auto space-y-4 flex-1 custom-scrollbar">
                <input type="hidden" id="task-id">

                <div>
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Titel der Aufgabe *</label>
                    <input type="text" id="task-title-input" required placeholder="z. B. Website Redesign Launch" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Startdatum *</label>
                        <input type="date" id="task-start-input" required class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Enddatum *</label>
                        <input type="date" id="task-end-input" required class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Zuweisung</label>
                        <select id="task-assignee-input" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                            <option value="">-- Nicht zugewiesen --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Status</label>
                        <select id="task-status-input" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                            <option value="OPEN">Offen</option>
                            <option value="IN_PROGRESS">In Bearbeitung</option>
                            <option value="WAIT">warte auf andere</option>
                            <option value="COMPLETED">Erledigt</option>
                        </select>
                    </div>
                </div>

                <!-- Subtasks Management Section -->
                <div class="pt-3 border-t border-slate-200 dark:border-slate-700">
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider">Unteraufgaben (mit eigenem Datum)</label>
                        <button type="button" id="btn-add-subtask-modal" class="text-xs text-brand-600 hover:text-brand-700 font-medium flex items-center gap-1">
                            <i data-lucide="plus" class="w-3.5 h-3.5"></i> Unteraufgabe hinzufügen
                        </button>
                    </div>
                    <div id="modal-subtask-list" class="space-y-2 max-h-52 overflow-y-auto p-1 custom-scrollbar"></div>
                </div>

                <div class="pt-4 border-t border-slate-200 dark:border-slate-700 flex justify-between items-center">
                    <button type="button" id="btn-modal-delete-task" class="px-3 py-2 bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/40 text-rose-600 rounded-lg text-sm font-medium transition hidden flex items-center gap-1">
                        <i data-lucide="trash-2" class="w-4 h-4"></i> Löschen
                    </button>
                    <div class="flex gap-2 ml-auto">
                        <button type="button" id="modal-task-cancel" class="px-4 py-2 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg text-sm font-medium transition">
                            Abbrechen
                        </button>
                        <button type="submit" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium transition shadow-sm">
                            Speichern
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: TEAM MEMBERS MANAGEMENT (z-50) -->
    <div id="modal-team" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 w-full max-w-md flex flex-col overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-800/80">
                <h3 class="font-bold text-lg text-slate-900 dark:text-white">Mitarbeiter verwalten</h3>
                <button id="modal-team-close" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="p-6 space-y-4">
                <form id="form-add-member" class="flex gap-2">
                    <input type="text" id="member-name-input" required placeholder="Name des Mitarbeiters" class="flex-1 px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    <button type="submit" class="px-3 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium transition flex items-center gap-1">
                        <i data-lucide="user-plus" class="w-4 h-4"></i> Hinzufügen
                    </button>
                </form>

                <p class="text-xs text-slate-500">Mitarbeiter per Drag & Drop (Anfasser ⋮⋮) verschieben.</p>
                <div id="team-members-list" class="space-y-2 max-h-60 overflow-y-auto pr-1 custom-scrollbar"></div>
            </div>
        </div>
    </div>

    <!-- HIGH z-index CONFIRMATION MODAL (z-[60]) -->
    <div id="modal-confirm" class="fixed inset-0 z-[60] bg-slate-900/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 w-full max-w-sm p-6 space-y-4">
            <div class="flex items-center gap-3 text-rose-600 dark:text-rose-500">
                <div class="p-2 bg-rose-100 dark:bg-rose-950/50 rounded-full">
                    <i data-lucide="alert-triangle" class="w-6 h-6"></i>
                </div>
                <h3 id="confirm-title" class="font-bold text-slate-900 dark:text-white text-base">Bestätigung erforderlich</h3>
            </div>
            <p id="confirm-message" class="text-sm text-slate-600 dark:text-slate-300">Möchten Sie dieses Element wirklich löschen?</p>
            <div class="flex justify-end gap-2 pt-2">
                <button id="confirm-cancel-btn" class="px-4 py-2 border border-slate-200 dark:border-slate-700 rounded-lg text-sm font-medium text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                    Abbrechen
                </button>
                <button id="confirm-ok-btn" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-sm font-medium transition shadow-sm">
                    Löschen
                </button>
            </div>
        </div>
    </div>

    <!-- APPLICATION LOGIC -->
    <script>
        const STORAGE_KEY = 'TASKFLOW_GANTT_PRO_DATA_V3';

        let appState = {
            viewMode: 'days',
            activeTab: 'gantt',
            filterSearch: '',
            filterMember: 'ALL',
            filterStatus: 'ALL',
            collapsedTasks: new Set(),
            members: [
                { id: 'm1', name: 'Anna Schmidt', avatarBg: 'bg-indigo-500' },
                { id: 'm2', name: 'Max Mustermann', avatarBg: 'bg-emerald-500' },
                { id: 'm3', name: 'Sarah Meyer', avatarBg: 'bg-amber-500' }
            ],
            tasks: [
                {
                    id: 't1',
                    title: 'Projekt Setup & Anforderung',
                    startDate: getOffsetDate(-5),
                    endDate: getOffsetDate(2),
                    assigneeId: 'm1',
                    status: 'COMPLETED',
                    subtasks: [
                        { id: 'st1', title: 'Kickoff-Meeting', startDate: getOffsetDate(-5), endDate: getOffsetDate(-3), completed: true, assigneeId: 'm1' },
                        { id: 'st2', title: 'Architektur Dokument', startDate: getOffsetDate(-2), endDate: getOffsetDate(2), completed: true, assigneeId: 'm2' }
                    ]
                },
                {
                    id: 't2',
                    title: 'UI Design & Prototyping',
                    startDate: getOffsetDate(1),
                    endDate: getOffsetDate(10),
                    assigneeId: 'm3',
                    status: 'IN_PROGRESS',
                    subtasks: [
                        { id: 'st3', title: 'Wireframes erstellen', startDate: getOffsetDate(1), endDate: getOffsetDate(5), completed: true, assigneeId: 'm3' },
                        { id: 'st4', title: 'Figma Prototyp', startDate: getOffsetDate(4), endDate: getOffsetDate(10), completed: false, assigneeId: 'm3' }

        // File System Access API State
        let fileHandle = null;
        let isAutoSaveEnabled = false;
        let autoSaveInterval = null;
        let lastSaveTime = null;

        let confirmAction = null;

        const VIEW_CONFIGS = {
            days: { cellWidth: 36, snapDays: 1, label: 'Tage' },
            weeks: { cellWidth: 26, snapDays: 1, label: 'Wochen' },
            months: { cellWidth: 10, snapDays: 1, label: 'Monate' }
        };

        function getOffsetDate(daysOffset) {
            const d = new Date();
            d.setDate(d.getDate() + daysOffset);
            return d.toISOString().split('T')[0];
        }

        function parseDate(dateStr) {
            if (!dateStr) return new Date();
            const [y, m, d] = dateStr.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function formatDateISO(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function formatDateGerman(dateStr) {
            if (!dateStr) return '';
            const d = parseDate(dateStr);
            return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function getDaysDifference(startStr, endStr) {
            const start = parseDate(startStr);
            const end = parseDate(endStr);
            const diffTime = end - start;
            return Math.max(1, Math.round(diffTime / (1000 * 60 * 60 * 24)) + 1);
        }

        function getISOWeekInfo(date) {
            const tempDate = new Date(date.valueOf());
            const dayNum = tempDate.getDay() || 7;
            tempDate.setDate(tempDate.getDate() + 4 - dayNum);
            const yearStart = new Date(tempDate.getFullYear(), 0, 1);
            const weekNo = Math.ceil((((tempDate - yearStart) / 86400000) + 1) / 7);

            const monday = new Date(date.valueOf());
            monday.setDate(monday.getDate() - (dayNum - 1));
            const sunday = new Date(monday.valueOf());
            sunday.setDate(sunday.getDate() + 6);

            return { week: weekNo, year: tempDate.getFullYear(), monday, sunday };
        }

        function recalculateParentTaskDates(task) {
            if (!task.subtasks || task.subtasks.length === 0) return;

            let minStart = task.startDate;
            let maxEnd = task.endDate;

            task.subtasks.forEach(st => {
                if (st.startDate && st.startDate < minStart) minStart = st.startDate;
                if (st.endDate && st.endDate > maxEnd) maxEnd = st.endDate;
            });

            task.startDate = minStart;
            task.endDate = maxEnd;
        }

        function calculateTaskProgress(task) {
            if (!task.subtasks || task.subtasks.length === 0) {
                return task.status === 'COMPLETED' ? 100 : (task.status === 'IN_PROGRESS' ? 50 : 0);
            }
            const doneCount = task.subtasks.filter(st => st.completed).length;
            return Math.round((doneCount / task.subtasks.length) * 100);
        }

        // LocalStorage save & auto-trigger file save
        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    members: appState.members,
                    tasks: appState.tasks,
                    viewMode: appState.viewMode
                }));
            } catch (e) {
                console.error("Local storage save error:", e);
            }

            if (isAutoSaveEnabled && fileHandle) {
                performFileAutoSave();
            }
        }

        function loadState() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    const parsed = JSON.parse(stored);
                    if (parsed.members) appState.members = parsed.members;
                    if (parsed.tasks) appState.tasks = parsed.tasks;
                    if (parsed.viewMode) appState.viewMode = parsed.viewMode;
                }
            } catch (e) {
                console.error("Error loading state:", e);
            }
        }

        // ==========================================
        // FILE SYSTEM ACCESS API AUTO-BACKUP
        // ==========================================
        async function setupAutoSaveFilePicker() {
            if (!('showSaveFilePicker' in window)) {
                showConfirmModal(
                    'Nicht unterstützt',
                    'Ihr Browser unterstützt die direkte Dateisicherung (File System Access API) nicht direkt. Nutzen Sie stattdessen den manuellen Export-Button oben.',
                    () => {}
                );
                return;
            }

            try {
                const options = {
                    suggestedName: `aufgaben_backup_${new Date().toISOString().split('T')[0]}.json`,
                    types: [{
                        description: 'JSON Sicherungsdatei',
                        accept: { 'application/json': ['.json'] },
                    }],
                };

                fileHandle = await window.showSaveFilePicker(options);
                isAutoSaveEnabled = true;

                updateBackupUI();
                startAutoSaveTimer();
                await performFileAutoSave();

            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error("Fehler beim Erstellen der Sicherungsdatei:", err);
                }
            }
        }

        async function performFileAutoSave() {
            if (!fileHandle || !isAutoSaveEnabled) return;

            try {
                const writable = await fileHandle.createWritable();
                const dataToSave = JSON.stringify({
                    members: appState.members,
                    tasks: appState.tasks,
                    viewMode: appState.viewMode,
                    lastExported: new Date().toISOString()
                }, null, 2);

                await writable.write(dataToSave);
                await writable.close();

                lastSaveTime = new Date();
                updateBackupUI();
            } catch (err) {
                console.error("Automatisches Speichern fehlgeschlagen:", err);
                // Switch dot to amber or red on failure
                const dot = document.getElementById('backup-status-dot');
                if (dot) dot.className = 'w-2.5 h-2.5 rounded-full bg-rose-500';
            }
        }

        function startAutoSaveTimer() {
            if (autoSaveInterval) clearInterval(autoSaveInterval);
            // Timer checks and writes every 30 seconds
            autoSaveInterval = setInterval(() => {
                if (isAutoSaveEnabled && fileHandle) {
                    performFileAutoSave();
                }
            }, 30000);
        }

        function toggleAutoSave() {
            if (!fileHandle) {
                setupAutoSaveFilePicker();
                return;
            }

            isAutoSaveEnabled = !isAutoSaveEnabled;
            if (isAutoSaveEnabled) {
                startAutoSaveTimer();
                performFileAutoSave();
            }
            updateBackupUI();
        }

            const dot = document.getElementById('backup-status-dot');

            } else if (fileHandle && !isAutoSaveEnabled) {

        }

        function getFilteredTasks() {
            return appState.tasks.filter(task => {

                    const matchTitle = task.title.toLowerCase().includes(q);
                    const matchSubtask = task.subtasks && task.subtasks.some(s => s.title.toLowerCase().includes(q));
                    if (!matchTitle && !matchSubtask) return false;
                }
                if (appState.filterMember !== 'ALL') {
                    if (task.assigneeId !== appState.filterMember) return false;

                if (appState.filterStatus !== 'ALL') {

                return true;

        function calculateTimelineRange(tasks) {
            let minDate = new Date();
            let maxDate = new Date();
            maxDate.setDate(maxDate.getDate() + 14);

            if (tasks.length > 0) {
                let minTime = Infinity;
                let maxTime = -Infinity;

                tasks.forEach(t => {
                    const start = parseDate(t.startDate).getTime();
                    const end = parseDate(t.endDate).getTime();
                    if (start < minTime) minTime = start;
                    if (end > maxTime) maxTime = end;

                    if (t.subtasks) {
                        t.subtasks.forEach(st => {
                            const sStart = parseDate(st.startDate).getTime();
                            const sEnd = parseDate(st.endDate).getTime();
                            if (sStart < minTime) minTime = sStart;
                            if (sEnd > maxTime) maxTime = sEnd;
                        });
                    }
                });

                if (minTime !== Infinity) minDate = new Date(minTime);
                if (maxTime !== -Infinity) maxDate = new Date(maxTime);
            }

            if (appState.viewMode === 'weeks') {
                const dayNum = minDate.getDay() || 7;
                minDate.setDate(minDate.getDate() - (dayNum - 1));
            }

            minDate.setDate(minDate.getDate() - 7);
            maxDate.setDate(maxDate.getDate() + 14);

            return { minDate, maxDate };
        }

        function renderGanttHeaders(startDate, totalDays, cellWidth) {
            const topHeader = document.getElementById('gantt-header-top');
            const bottomHeader = document.getElementById('gantt-header-bottom');
            topHeader.innerHTML = '';
            bottomHeader.innerHTML = '';

            const dayMs = 86400000;
            const mode = appState.viewMode;

            if (mode === 'days') {
                let currentMonth = -1;
                let currentMonthCellSpan = 0;
                let monthLabelElem = null;

                for (let i = 0; i < totalDays; i++) {
                    const date = new Date(startDate.getTime() + i * dayMs);
                    const month = date.getMonth();

                    if (month !== currentMonth) {
                        currentMonth = month;
                        monthLabelElem = document.createElement('div');
                        monthLabelElem.className = 'border-r border-slate-200 dark:border-slate-700 px-2 flex items-center justify-center bg-slate-100/70 dark:bg-slate-800/70 truncate';
                        monthLabelElem.textContent = date.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
                        topHeader.appendChild(monthLabelElem);
                        currentMonthCellSpan = 0;
                    }

                    currentMonthCellSpan++;
                    monthLabelElem.style.width = `${currentMonthCellSpan * cellWidth}px`;

                    const dayCell = document.createElement('div');
                    dayCell.style.width = `${cellWidth}px`;
                    dayCell.className = `flex-none border-r border-slate-100 dark:border-slate-800 flex items-center justify-center text-[10px] ${date.getDay() === 0 || date.getDay() === 6 ? 'bg-slate-100/50 dark:bg-slate-800/40 text-slate-400' : ''}`;
                    dayCell.textContent = date.getDate();
                    bottomHeader.appendChild(dayCell);
                }
            } else if (mode === 'weeks') {
                let currentWeekKey = '';
                let weekSpan = 0;
                let weekLabelElem = null;

                for (let i = 0; i < totalDays; i++) {
                    const date = new Date(startDate.getTime() + i * dayMs);
                    const weekInfo = getISOWeekInfo(date);
                    const weekKey = `${weekInfo.year}-W${weekInfo.week}`;

                    if (weekKey !== currentWeekKey) {
                        currentWeekKey = weekKey;
                        weekLabelElem = document.createElement('div');
                        weekLabelElem.className = 'border-r border-slate-300 dark:border-slate-600 px-2 flex items-center justify-center bg-brand-50/80 dark:bg-brand-950/40 text-brand-700 dark:text-brand-300 font-bold truncate text-[11px]';
                        
                        const mStr = weekInfo.monday.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
                        const sStr = weekInfo.sunday.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
                        
                        weekLabelElem.textContent = `KW ${weekInfo.week} • ${mStr} - ${sStr}`;
                        topHeader.appendChild(weekLabelElem);
                        weekSpan = 0;
                    }

                    weekSpan++;
                    weekLabelElem.style.width = `${weekSpan * cellWidth}px`;

                    const dayCell = document.createElement('div');
                    dayCell.style.width = `${cellWidth}px`;
                    const dayNames = ['S', 'M', 'D', 'M', 'D', 'F', 'S'];
                    const isMonday = date.getDay() === 1;
                    dayCell.className = `flex-none border-r ${isMonday ? 'border-slate-300 dark:border-slate-600 bg-slate-100 dark:bg-slate-800 font-bold' : 'border-slate-100 dark:border-slate-800/60'} flex items-center justify-center text-[10px] ${date.getDay() === 0 || date.getDay() === 6 ? 'text-slate-400' : ''}`;
                    dayCell.textContent = dayNames[date.getDay()];
                    bottomHeader.appendChild(dayCell);
                }
            } else if (mode === 'months') {
                let currentYear = -1;
                let currentYearCellSpan = 0;
                let yearLabelElem = null;

                for (let i = 0; i < totalDays; i++) {
                    const date = new Date(startDate.getTime() + i * dayMs);
                    const year = date.getFullYear();

                    if (year !== currentYear) {
                        currentYear = year;
                        yearLabelElem = document.createElement('div');

        // ==========================================
        // GANTT DRAG & RESIZE ENGINE
        // ==========================================
        function attachGanttDragListeners(timelineMinDate, cellWidth) {
            const bars = document.querySelectorAll('.gantt-bar');
            const tooltip = document.getElementById('gantt-tooltip');
            const tooltipTitle = document.getElementById('tooltip-title');
            const tooltipDates = document.getElementById('tooltip-dates');
            const tooltipDuration = document.getElementById('tooltip-duration');

            bars.forEach(bar => {
                bar.addEventListener('mousedown', (e) => {
                    e.preventDefault();

                    const taskId = bar.dataset.taskId;
                    const isSubtask = bar.dataset.isSubtask === 'true';
                    const subtaskId = bar.dataset.subtaskId;
                    const isResizeLeft = e.target.classList.contains('left');
                    const isResizeRight = e.target.classList.contains('right');
                    const isMove = !isResizeLeft && !isResizeRight;

                    const task = appState.tasks.find(t => t.id === taskId);
                    if (!task) return;

                    let itemObj = isSubtask ? task.subtasks.find(s => s.id === subtaskId) : task;
                    if (!itemObj) return;

                    const startX = e.clientX;
                    const initialLeft = parseFloat(bar.style.left) || 0;
                    const initialWidth = parseFloat(bar.style.width) || 0;

                    let newStartDateStr = itemObj.startDate || task.startDate;
                    let newEndDateStr = itemObj.endDate || task.endDate;

                    tooltipTitle.textContent = (isSubtask ? 'Unteraufgabe: ' : 'Aufgabe: ') + itemObj.title;
                    tooltip.classList.remove('hidden');

                    function onMouseMove(moveEvent) {
                        const deltaX = moveEvent.clientX - startX;
                        const deltaDays = Math.round(deltaX / cellWidth);

                        if (isMove) {
                            const initialStart = parseDate(itemObj.startDate || task.startDate);
                            const initialEnd = parseDate(itemObj.endDate || task.endDate);

                            const newStart = new Date(initialStart.getTime() + deltaDays * 86400000);
                            const newEnd = new Date(initialEnd.getTime() + deltaDays * 86400000);

                            newStartDateStr = formatDateISO(newStart);
                            newEndDateStr = formatDateISO(newEnd);

                            bar.style.left = `${initialLeft + (deltaDays * cellWidth)}px`;
                        } else if (isResizeRight) {
                            const durationDays = getDaysDifference(itemObj.startDate || task.startDate, itemObj.endDate || task.endDate);
                            const newDuration = Math.max(1, durationDays + deltaDays);

                            const initialStart = parseDate(itemObj.startDate || task.startDate);
                            const newEnd = new Date(initialStart.getTime() + (newDuration - 1) * 86400000);

                            newEndDateStr = formatDateISO(newEnd);
                            bar.style.width = `${newDuration * cellWidth}px`;
                        } else if (isResizeLeft) {
                            const initialStart = parseDate(itemObj.startDate || task.startDate);
                            const initialEnd = parseDate(itemObj.endDate || task.endDate);

                            const newStart = new Date(initialStart.getTime() + deltaDays * 86400000);

                            if (newStart <= initialEnd) {
                                newStartDateStr = formatDateISO(newStart);
                                bar.style.left = `${initialLeft + (deltaDays * cellWidth)}px`;
                                bar.style.width = `${initialWidth - (deltaDays * cellWidth)}px`;
                            }
                        }

                        tooltip.style.left = `${moveEvent.clientX + 12}px`;
                        tooltip.style.top = `${moveEvent.clientY + 12}px`;

                        const duration = getDaysDifference(newStartDateStr, newEndDateStr);
                        const kwInfo = getISOWeekInfo(parseDate(newStartDateStr));
                        tooltipDates.textContent = `${formatDateGerman(newStartDateStr)} - ${formatDateGerman(newEndDateStr)} (KW ${kwInfo.week})`;
                        tooltipDuration.textContent = `Dauer: ${duration} Tag(e)`;
                    }

                    function onMouseUp() {
                        document.removeEventListener('mousemove', onMouseMove);
                        document.removeEventListener('mouseup', onMouseUp);
                        tooltip.classList.add('hidden');

                        itemObj.startDate = newStartDateStr;
                        itemObj.endDate = newEndDateStr;

                        if (isSubtask) {
                            recalculateParentTaskDates(task);
                        }

                        saveState();
                        renderAll();
                    }

                    document.addEventListener('mousemove', onMouseMove);
                    document.addEventListener('mouseup', onMouseUp);
                });
            });
        }

        // ==========================================
        // REORDERING & DRAG & DROP SYSTEM FOR LISTS
        // ==========================================
        function setupDragAndDropSorting() {
            let draggedElement = null;

            document.addEventListener('dragstart', (e) => {
                const target = e.target.closest('[draggable="true"]');
                if (!target) return;

                draggedElement = target;
                e.dataTransfer.effectAllowed = 'move';
                target.classList.add('opacity-50');
            });

            document.addEventListener('dragend', (e) => {
                if (draggedElement) {
                    draggedElement.classList.remove('opacity-50');
                    draggedElement = null;
                }
            });

            document.addEventListener('dragover', (e) => {
                e.preventDefault();
                if (!draggedElement) return;

                const target = e.target.closest('[draggable="true"]');
                if (!target || target === draggedElement) return;

                // Handle Member Reordering
                if (draggedElement.classList.contains('draggable-member') && target.classList.contains('draggable-member')) {
                    const list = document.getElementById('team-members-list');
                    const items = Array.from(list.children);
                    const draggedIdx = items.indexOf(draggedElement);
                    const targetIdx = items.indexOf(target);

                    if (draggedIdx > -1 && targetIdx > -1) {
                        const [movedMember] = appState.members.splice(draggedIdx, 1);
                        appState.members.splice(targetIdx, 0, movedMember);
                        saveState();
                        renderTeamMembersList();
                        populateMemberDropdowns();
                    }
                }

                // Handle Main Tasks Reordering (Gantt Sidebar or List View)
                if ((draggedElement.classList.contains('draggable-task-sidebar') && target.classList.contains('draggable-task-sidebar')) ||
                    (draggedElement.classList.contains('draggable-task-list') && target.classList.contains('draggable-task-list'))) {
                    
                    const draggedId = draggedElement.dataset.taskId;
                    const targetId = target.dataset.taskId;

                    const draggedIdx = appState.tasks.findIndex(t => t.id === draggedId);
                    const targetIdx = appState.tasks.findIndex(t => t.id === targetId);

                    if (draggedIdx > -1 && targetIdx > -1 && draggedIdx !== targetIdx) {
                        const [movedTask] = appState.tasks.splice(draggedIdx, 1);
                        appState.tasks.splice(targetIdx, 0, movedTask);
                        saveState();
                        renderAll();
                    }
                }

                // Handle Subtasks Reordering inside Modal
                if (draggedElement.classList.contains('draggable-modal-subtask') && target.classList.contains('draggable-modal-subtask')) {
                    const list = document.getElementById('modal-subtask-list');
                    const items = Array.from(list.children);
                    const draggedIdx = items.indexOf(draggedElement);
                    const targetIdx = items.indexOf(target);

                    if (draggedIdx > -1 && targetIdx > -1) {
                        if (draggedIdx < targetIdx) {
                            list.insertBefore(draggedElement, target.nextSibling);
                        } else {
                            list.insertBefore(draggedElement, target);
                        }
                    }
                }
            });
        }

            document.getElementById('btn-setup-backup').addEventListener('click', setupAutoSaveFilePicker);
            document.getElementById('btn-toggle-backup').addEventListener('click', toggleAutoSave);

            document.getElementById('btn-theme-toggle').addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
            });

            document.getElementById('btn-export').addEventListener('click', exportDataJSON);
            document.getElementById('import-file-input').addEventListener('change', importDataJSON);
        }

        function setViewMode(mode) {
            appState.viewMode = mode;
            updateViewModeUI();
            saveState();
            renderAll();
        }

        function updateViewModeUI() {
            const modes = ['days', 'weeks', 'months'];
            modes.forEach(m => {
                const btn = document.getElementById(`view-mode-${m}`);
                if (m === appState.viewMode) {
                    btn.className = 'px-2.5 py-1 text-xs font-semibold rounded-md transition-all bg-white dark:bg-slate-700 text-brand-600 dark:text-brand-400 shadow-sm';
                } else {
                    btn.className = 'px-2.5 py-1 text-xs font-semibold rounded-md transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white';
                }
            });
        }

        function setActiveTab(tab) {
            appState.activeTab = tab;
            const btnGantt = document.getElementById('tab-btn-gantt');
            const btnList = document.getElementById('tab-btn-list');

            if (tab === 'gantt') {
                btnGantt.className = 'flex items-center gap-1.5 px-3 py-1 text-xs font-semibold rounded-md bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm transition';
                btnList.className = 'flex items-center gap-1.5 px-3 py-1 text-xs font-semibold rounded-md text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition';
            } else {
                btnList.className = 'flex items-center gap-1.5 px-3 py-1 text-xs font-semibold rounded-md bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm transition';
                btnGantt.className = 'flex items-center gap-1.5 px-3 py-1 text-xs font-semibold rounded-md text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition';
            }
            renderAll();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, (m) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            })[m]);
        }

        function exportDataJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `TaskFlow_Export_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importDataJSON(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const parsed = JSON.parse(event.target.result);
                    if (parsed.tasks && parsed.members) {
                        appState.tasks = parsed.tasks;
                        appState.members = parsed.members;
                        if (parsed.viewMode) appState.viewMode = parsed.viewMode;
                        saveState();
                        renderAll();
                    }
                } catch (err) {
                    alert("Ungültiges JSON Format!");
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
